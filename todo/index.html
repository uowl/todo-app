<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>Todo</title>
<style>
:root{--bg:#f2f2f7;--card:#fff;--label:#000;--label2:#6c6c70;--sep:rgba(60,60,67,.18);--blue:#007aff;--red:#ff3b30;--orange:#ff9500;--green:#34c759;--fill:rgba(118,118,128,.12);--bar:rgba(242,242,247,.72)}
@media(prefers-color-scheme:dark){:root{--bg:#000;--card:#1c1c1e;--label:#fff;--label2:#98989f;--sep:rgba(84,84,88,.6);--blue:#0a84ff;--red:#ff453a;--orange:#ff9f0a;--green:#30d158;--fill:rgba(118,118,128,.24);--bar:rgba(0,0,0,.72)}}
:root[data-theme=light]{--bg:#f2f2f7;--card:#fff;--label:#000;--label2:#6c6c70;--sep:rgba(60,60,67,.18);--fill:rgba(118,118,128,.12);--bar:rgba(242,242,247,.72);color-scheme:light}
:root[data-theme=dark]{--bg:#000;--card:#1c1c1e;--label:#fff;--label2:#98989f;--sep:rgba(84,84,88,.6);--fill:rgba(118,118,128,.24);--bar:rgba(0,0,0,.72);color-scheme:dark}
:root[data-theme=midnight]{--bg:#0b1220;--card:#131c30;--label:#e8eefc;--label2:#8d9bbb;--sep:rgba(120,140,190,.25);--fill:rgba(120,140,190,.16);--bar:rgba(11,18,32,.75);color-scheme:dark}
:root[data-theme=sepia]{--bg:#f4ecd8;--card:#fbf6e9;--label:#3b2f1e;--label2:#85755c;--sep:rgba(90,70,40,.2);--fill:rgba(120,95,50,.12);--bar:rgba(244,236,216,.78);color-scheme:light}
:root[data-accent=purple]{--blue:#af52de}:root[data-accent=green]{--blue:#28a745}:root[data-accent=orange]{--blue:#f08a00}:root[data-accent=pink]{--blue:#ff2d78}:root[data-accent=teal]{--blue:#00a5b5}
.date{font-size:15px;color:var(--label2);margin:-4px 0 8px}
.tools{display:flex;gap:8px;align-items:center}
.ibtn{border:0;background:var(--fill);border-radius:50%;width:32px;height:32px;cursor:pointer;font-size:16px}
.pop{position:absolute;right:16px;top:56px;background:var(--card);border-radius:14px;box-shadow:0 10px 40px rgba(0,0,0,.3);padding:14px;display:none;z-index:30;width:250px}
.pop h4{margin:0 0 8px;font-size:12px;text-transform:uppercase;letter-spacing:.5px;color:var(--label2)}
.opts{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
.opts button{border:1.5px solid transparent;background:var(--fill);border-radius:8px;padding:5px 10px;font-size:13px;cursor:pointer}
.opts button.on{border-color:var(--blue)}
.sw{width:26px;height:26px;border-radius:50%;padding:0!important;border:2px solid transparent}
.sw.on{outline:2px solid var(--label2);outline-offset:2px}
.cal{background:var(--card);border-radius:12px;padding:12px;margin-bottom:16px}
.ch{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.ch b{font-size:18px}.ch button{border:0;background:var(--fill);border-radius:8px;padding:4px 10px;cursor:pointer}
.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;text-align:center}
.grid .dow{font-size:11px;color:var(--label2);text-transform:uppercase;padding:4px 0}
.day{border:0;background:none;border-radius:10px;padding:6px 0 4px;min-height:48px;cursor:pointer;font-size:15px;display:flex;flex-direction:column;align-items:center;gap:3px}
.day:hover{background:var(--fill)}.day.out{color:var(--label2);opacity:.45}
.day.today span{background:var(--blue);color:#fff;border-radius:50%;width:26px;height:26px;display:grid;place-items:center}
.day.sel{background:var(--fill);outline:2px solid var(--blue)}
.dots{display:flex;gap:2px;height:6px}.dots i{width:5px;height:5px;border-radius:50%;background:var(--blue)}.dots i.od{background:var(--red)}.dots i.dn{background:var(--green)}
.f .pick{flex:none;width:auto;color:var(--blue)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--label);font:17px/1.35 -apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",system-ui,sans-serif;-webkit-font-smoothing:antialiased}
header{position:sticky;top:0;z-index:5;background:var(--bar);backdrop-filter:saturate(180%) blur(20px);-webkit-backdrop-filter:saturate(180%) blur(20px);border-bottom:.5px solid var(--sep);padding:12px 16px 10px}
.wrap{max-width:680px;margin:0 auto}
h1{font:700 34px/1.1 -apple-system,"SF Pro Display",system-ui,sans-serif;letter-spacing:.37px;margin:4px 0 10px}
input,select,textarea,button{font:inherit;color:inherit}
.search{width:100%;border:0;border-radius:10px;background:var(--fill);padding:7px 12px;margin-bottom:10px}
.seg{display:flex;background:var(--fill);border-radius:9px;padding:2px}
.seg button{flex:1;border:0;background:none;border-radius:7px;padding:5px;font-size:13px;font-weight:500;cursor:pointer}
.seg button.on{background:var(--card);box-shadow:0 3px 8px rgba(0,0,0,.12),0 3px 1px rgba(0,0,0,.04)}
main{padding:16px}
.card{background:var(--card);border-radius:12px;overflow:hidden;margin-bottom:16px}
.row{display:flex;gap:12px;align-items:flex-start;padding:11px 16px;position:relative;cursor:pointer}
.row+.row::before{content:"";position:absolute;top:0;left:52px;right:0;border-top:.5px solid var(--sep)}
.row.sub{padding-left:44px}
.row.sub::before{left:80px}
.circle{flex:none;width:24px;height:24px;border-radius:50%;border:1.5px solid var(--label2);background:none;margin-top:1px;cursor:pointer;display:grid;place-items:center;padding:0}
.circle.high{border-color:var(--red)}.circle.medium{border-color:var(--orange)}.circle.low{border-color:var(--blue)}
.done .circle{background:var(--blue);border-color:var(--blue)}
.done .circle::after{content:"";width:6px;height:11px;border:solid #fff;border-width:0 2px 2px 0;transform:rotate(45deg) translate(-1px,-1px)}
.done .t{text-decoration:line-through;color:var(--label2)}
.body{flex:1;min-width:0}
.meta{font-size:13px;color:var(--label2);display:flex;flex-wrap:wrap;gap:4px 10px}
.meta .od{color:var(--red);font-weight:600}
.tag{color:var(--blue)}
.empty{text-align:center;color:var(--label2);padding:40px 0}
.fab{position:fixed;right:20px;bottom:calc(20px + env(safe-area-inset-bottom));width:56px;height:56px;border-radius:50%;border:0;background:var(--blue);color:#fff;font-size:32px;line-height:1;box-shadow:0 6px 18px rgba(0,122,255,.4);cursor:pointer}
.undo{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--card);border-radius:14px;padding:10px 18px;box-shadow:0 8px 30px rgba(0,0,0,.25);display:none;gap:14px;align-items:center}
.undo button{border:0;background:none;color:var(--blue);font-weight:600;cursor:pointer}
dialog{border:0;border-radius:14px;padding:0;width:min(92vw,420px);background:var(--card);color:var(--label);box-shadow:0 20px 60px rgba(0,0,0,.35)}
dialog::backdrop{background:rgba(0,0,0,.35);backdrop-filter:blur(4px)}
form{display:flex;flex-direction:column}
.f{display:flex;align-items:center;gap:10px;padding:10px 16px;border-bottom:.5px solid var(--sep)}
.f label{width:70px;color:var(--label2);font-size:15px}
.f input,.f select,.f textarea{flex:1;border:0;background:none;outline:none;min-width:0}
.bar{display:flex;justify-content:space-between;padding:12px 16px}
.bar button{border:0;background:none;color:var(--blue);font-weight:600;cursor:pointer;padding:4px 0}
.bar .del{color:var(--red);font-weight:400}
.err{color:var(--red);padding:8px 16px;font-size:14px;display:none}
button:focus-visible,input:focus-visible,select:focus-visible,.row:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
.top{display:flex;align-items:baseline;justify-content:space-between}
.sub-h{color:var(--label2);font-size:14px;margin:0 0 8px}
.prog{height:4px;border-radius:2px;background:var(--fill);margin:0 0 10px;overflow:hidden}.prog i{display:block;height:100%;background:var(--green);width:0;transition:width .3s}
.quick{display:flex;gap:8px;margin-bottom:16px}
.quick input{flex:1;border:0;border-radius:12px;background:var(--card);padding:12px 16px;box-shadow:0 1px 2px rgba(0,0,0,.06)}
.quick button{border:0;border-radius:12px;background:var(--blue);color:#fff;font-weight:600;padding:0 18px;cursor:pointer}
.gh{font-size:13px;font-weight:600;text-transform:uppercase;letter-spacing:.5px;color:var(--label2);margin:18px 4px 6px}
.gh.od{color:var(--red)}
.row:hover{background:var(--fill)}
.chip{font-size:11px;font-weight:600;border-radius:6px;padding:1px 6px;text-transform:uppercase}
.chip.high{background:rgba(255,59,48,.15);color:var(--red)}
.cnt{color:var(--label2);font-weight:400;margin-left:3px}
.toast{position:fixed;left:50%;top:16px;transform:translateX(-50%);background:var(--red);color:#fff;border-radius:12px;padding:10px 18px;display:none;z-index:20}
.empty b{display:block;font-size:20px;color:var(--label);margin-bottom:4px}
</style>
</head>
<body>
<header><div class="wrap">
<div class="top"><h1>Todo</h1><div class="tools"><span class="sub-h" id="sub" style="margin:0"></span><button class="ibtn" id="tbtn" aria-label="Appearance" title="Appearance">🎨</button></div></div><div class="date" id="date"></div>
<div class="pop" id="pop"><h4>Theme</h4><div class="opts" id="themes"></div><h4>Accent</h4><div class="opts" id="accents"></div></div><div class="prog"><i id="pb"></i></div>
<input class="search" id="q" type="search" placeholder="Search" aria-label="Search">
<div class="seg" id="seg"><button data-s="pending" class="on">Pending<span class="cnt" id="c1"></span></button><button data-s="done">Done<span class="cnt" id="c2"></span></button><button data-s="all">All<span class="cnt" id="c3"></span></button><button data-s="cal">Calendar</button></div>
</div></header>
<main class="wrap"><form class="quick" id="qf"><input id="qa" placeholder="Add a task… (Enter)" aria-label="Quick add" autocomplete="off"><button>Add</button></form><div id="list"></div><div style="text-align:center;margin:16px"><button class="undo-link" id="clr" style="display:none;border:0;background:none;color:var(--red);font-weight:600;cursor:pointer">Clear completed</button></div></main>
<button class="fab" id="add" aria-label="New task">+</button>
<div class="toast" id="toast" role="alert"></div>
<div class="undo" id="undo"><span id="umsg">Deleted</span><button id="ubtn">Undo</button></div>
<dialog id="dlg"><form id="form" method="dialog">
<div class="f"><label for="title">Title</label><input id="title" required autocomplete="off"></div>
<div class="f"><label for="priority">Priority</label><select id="priority"><option>low</option><option selected>medium</option><option>high</option></select></div>
<div class="f"><label for="due">Due</label><input id="due" placeholder="YYYY-MM-DD, tomorrow, +3d"><input type="date" id="dpick" class="pick" aria-label="Pick date"></div>
<div class="f"><label for="tags">Tags</label><input id="tags" placeholder="comma separated"></div>
<div class="f"><label for="repeat">Repeat</label><select id="repeat"><option value="">never</option><option>daily</option><option>weekly</option><option>monthly</option></select></div>
<div class="f"><label for="note">Note</label><textarea id="note" rows="2"></textarea></div>
<div class="err" id="err"></div>
<div class="bar"><button type="button" id="cancel">Cancel</button><button type="button" class="del" id="del">Delete</button><button type="submit">Save</button></div>
</form></dialog>
<script>
const $=id=>document.getElementById(id);
let status="pending",editing=null,tasks=[];
async function api(m,u,b){const r=await fetch(u,{method:m,headers:{"Content-Type":"application/json"},body:b?JSON.stringify(b):undefined});const d=await r.json();if(!r.ok)throw new Error(d.error||r.status);return d}
const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
async function load(){tasks=await api("GET","/api/tasks?status="+(status==="cal"?"all":status)+"&q="+encodeURIComponent($("q").value));render();counts()}
function row(t,sub){const meta=[];if(t.due)meta.push(`<span class="${t.overdue?"od":""}">${t.overdue?"Overdue · ":""}${esc(t.due)}</span>`);
 if(t.repeat)meta.push("↻ "+t.repeat);t.tags.forEach(g=>meta.push(`<span class="tag">#${esc(g)}</span>`));if(t.note)meta.push("note");if(t.priority==="high"&&!t.done)meta.unshift(`<span class="chip high">high</span>`);
 return `<div class="row ${sub?"sub":""} ${t.done?"done":""}" data-id="${t.id}" tabindex="0"><button class="circle ${t.priority}" data-c="${t.id}" aria-label="Toggle done"></button><div class="body"><div class="t">${esc(t.title)}</div>${meta.length?`<div class="meta">${meta.join("")}</div>`:""}</div></div>`}
function grp(t){if(t.overdue)return"Overdue";if(!t.due)return"No date";const l=new Date();const today=l.getFullYear()+"-"+String(l.getMonth()+1).padStart(2,"0")+"-"+String(l.getDate()).padStart(2,"0");return t.due===today?"Today":"Upcoming"}
const MN=["January","February","March","April","May","June","July","August","September","October","November","December"];
const iso=d=>d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
let cm=new Date(),sel=iso(new Date());cm.setDate(1);
function renderCal(){const y=cm.getFullYear(),m=cm.getMonth(),first=new Date(y,m,1),start=new Date(y,m,1-first.getDay()),td=iso(new Date());
 const by={};tasks.forEach(t=>{if(t.due)(by[t.due]=by[t.due]||[]).push(t)});
 let h=`<div class="cal"><div class="ch"><button data-n="-1" aria-label="Previous month">‹</button><b>${MN[m]} ${y}</b><span><button data-n="0">Today</button> <button data-n="1" aria-label="Next month">›</button></span></div><div class="grid">`+["S","M","T","W","T","F","S"].map(d=>`<div class="dow">${d}</div>`).join("");
 for(let i=0;i<42;i++){const d=new Date(start.getFullYear(),start.getMonth(),start.getDate()+i),k=iso(d),ts=by[k]||[];
  const dots=ts.slice(0,3).map(t=>`<i class="${t.done?"dn":t.overdue?"od":""}"></i>`).join("");
  h+=`<button class="day ${d.getMonth()!==m?"out":""} ${k===td?"today":""} ${k===sel?"sel":""}" data-d="${k}" aria-label="${k}, ${ts.length} tasks"><span>${d.getDate()}</span><div class="dots">${dots}</div></button>`}
 h+="</div></div>";const ds=(by[sel]||[]);const dd=new Date(sel+"T00:00:00");
 h+=`<div class="gh">${dd.toLocaleDateString(undefined,{weekday:"long",month:"long",day:"numeric"})}</div>`+(ds.length?`<div class="card">${ds.map(t=>row(t)).join("")}</div>`:`<div class="empty">Nothing due.<br><button id="calnew" style="border:0;background:none;color:var(--blue);font-weight:600;cursor:pointer;margin-top:8px">+ Add task for this day</button></div>`);
 $("list").innerHTML=h}
function render(){if(status==="cal")return renderCal();const ids=new Set(tasks.map(t=>t.id));const tops=tasks.filter(t=>!ids.has(t.parent));
 const card=ts=>`<div class="card">${ts.map(t=>row(t)+tasks.filter(c=>c.parent===t.id).map(c=>row(c,1)).join("")).join("")}</div>`;
 if(!tops.length){$("list").innerHTML=`<div class="empty"><b>${status==="done"?"Nothing completed yet":"All clear"}</b>${status==="pending"?"Add a task above to get started.":"No tasks here."}</div>`;return}
 if(status!=="pending"){$("list").innerHTML=card(tops);return}
 const order=["Overdue","Today","Upcoming","No date"],g={};tops.forEach(t=>(g[grp(t)]=g[grp(t)]||[]).push(t));
 $("list").innerHTML=order.filter(k=>g[k]).map(k=>`<div class="gh ${k==="Overdue"?"od":""}">${k}</div>${card(g[k])}`).join("")}
async function counts(){try{const a=await api("GET","/api/tasks?status=all");const d=a.filter(t=>t.done).length;$("c1").textContent=a.length-d;$("c2").textContent=d;$("c3").textContent=a.length;$("pb").style.width=(a.length?100*d/a.length:0)+"%";$("sub").textContent=a.length?d+" of "+a.length+" completed":""}catch(x){}}
function toast(m){const e=$("toast");e.textContent=m;e.style.display="block";setTimeout(()=>e.style.display="none",4000)}
$("qf").onsubmit=async e=>{e.preventDefault();const v=$("qa").value.trim();if(!v)return;try{await api("POST","/api/tasks",{title:v});$("qa").value="";load()}catch(x){toast(x.message)}};
$("list").onkeydown=e=>{if(e.key==="Enter"&&e.target.classList.contains("row"))e.target.click()};
$("list").onclick=async e=>{const n=e.target.closest("[data-n]"),dy=e.target.closest("[data-d]");
 if(n){const v=+n.dataset.n;if(v===0){cm=new Date();cm.setDate(1);sel=iso(new Date())}else cm=new Date(cm.getFullYear(),cm.getMonth()+v,1);return render()}
 if(dy){sel=dy.dataset.d;return render()}
 if(e.target.id==="calnew"){openDlg();$("due").value=sel;return}
 const c=e.target.closest("[data-c]");try{if(c){const t=tasks.find(x=>x.id==c.dataset.c);await api("PATCH","/api/tasks/"+t.id,{done:!t.done});load()}else{const r=e.target.closest(".row");if(r)openDlg(tasks.find(x=>x.id==r.dataset.id))}}catch(x){toast(x.message)}};
$("seg").onclick=e=>{const b=e.target.closest("button");if(!b)return;status=b.dataset.s;[...$("seg").children].forEach(x=>x.classList.toggle("on",x===b));load()};
let tm;$("q").oninput=()=>{clearTimeout(tm);tm=setTimeout(load,150)};
function openDlg(t){editing=t||null;$("title").value=t?t.title:"";$("priority").value=t?t.priority:"medium";$("due").value=t&&t.due||"";$("tags").value=t?t.tags.join(", "):"";$("repeat").value=t&&t.repeat||"";$("note").value=t?t.note:"";$("del").style.display=t?"":"none";$("err").style.display="none";$("dlg").showModal();$("title").focus()}
$("add").onclick=()=>openDlg();$("cancel").onclick=()=>$("dlg").close();
$("form").onsubmit=async e=>{e.preventDefault();const b={title:$("title").value,priority:$("priority").value,due:$("due").value.trim(),tags:$("tags").value.split(",").map(s=>s.trim()).filter(Boolean),repeat:$("repeat").value,note:$("note").value};
 try{editing?await api("PATCH","/api/tasks/"+editing.id,b):await api("POST","/api/tasks",b);$("dlg").close();load()}catch(x){$("err").textContent=x.message;$("err").style.display="block"}};
let ut;$("del").onclick=async()=>{try{await api("DELETE","/api/tasks/"+editing.id);$("dlg").close();$("undo").style.display="flex";clearTimeout(ut);ut=setTimeout(()=>$("undo").style.display="none",6000);load()}catch(x){toast(x.message)}};
$("ubtn").onclick=async()=>{try{await api("POST","/api/restore",{});$("undo").style.display="none";load()}catch(x){toast(x.message)}};
$("clr").onclick=async()=>{if(!confirm("Remove all completed tasks?"))return;try{const r=await api("POST","/api/clear",{});$("umsg").textContent="Removed "+r.removed;$("undo").style.display="flex";clearTimeout(ut);ut=setTimeout(()=>$("undo").style.display="none",6000);load()}catch(x){toast(x.message)}};
const _render=render;render=function(){_render();$("clr").style.display=status==="done"&&tasks.length?"":"none"};
document.addEventListener("keydown",e=>{if(e.metaKey||e.ctrlKey||e.altKey||$("dlg").open||/INPUT|TEXTAREA|SELECT/.test(e.target.tagName))return;if(e.key==="n"){e.preventDefault();openDlg()}else if(e.key==="/"){e.preventDefault();$("q").focus()}});
const THEMES=[["system","System"],["light","Light"],["dark","Dark"],["midnight","Midnight"],["sepia","Sepia"]],ACC=[["blue","#007aff"],["purple","#af52de"],["green","#28a745"],["orange","#f08a00"],["pink","#ff2d78"],["teal","#00a5b5"]];
const ls=(k,d)=>{try{return localStorage.getItem(k)||d}catch(x){return d}},lset=(k,v)=>{try{localStorage.setItem(k,v)}catch(x){}};
function applyTheme(){const t=ls("theme","system"),a=ls("accent","blue"),r=document.documentElement;
 if(t==="system")r.removeAttribute("data-theme");else r.dataset.theme=t;if(a==="blue")r.removeAttribute("data-accent");else r.dataset.accent=a;
 $("themes").innerHTML=THEMES.map(([k,n])=>`<button data-t="${k}" class="${k===t?"on":""}">${n}</button>`).join("");
 $("accents").innerHTML=ACC.map(([k,c])=>`<button data-a="${k}" class="sw ${k===a?"on":""}" style="background:${c}" aria-label="${k}"></button>`).join("")}
$("pop").onclick=e=>{const b=e.target.closest("button");if(!b)return;if(b.dataset.t)lset("theme",b.dataset.t);if(b.dataset.a)lset("accent",b.dataset.a);applyTheme()};
$("tbtn").onclick=e=>{e.stopPropagation();const p=$("pop");p.style.display=p.style.display==="block"?"none":"block"};
document.addEventListener("click",e=>{if(!e.target.closest("#pop"))$("pop").style.display="none"});
$("dpick").onchange=()=>{if($("dpick").value)$("due").value=$("dpick").value};
function showDate(){$("date").textContent=new Date().toLocaleDateString(undefined,{weekday:"long",month:"long",day:"numeric",year:"numeric"})}
applyTheme();showDate();setInterval(showDate,60000);
load();
</script>
</body>
</html>
